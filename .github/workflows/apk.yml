name: APK Uret

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Derle
        run: |
          flutter create --org com.afitashali --project-name afitashali clean_app
          cp lib/main.dart clean_app/lib/main.dart
          cd clean_app
          flutter build apk --debug

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Afitashali-APK
          path: clean_app/build/app/outputs/flutter-apk/app-debug.apk
